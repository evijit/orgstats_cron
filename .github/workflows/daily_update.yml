name: Daily HF Data Update (Models, Datasets & Papers)

on:
  schedule:
    - cron: '0 2 * * *'  # Run at 2 AM UTC daily
  workflow_dispatch:

env:
  # How many citation jobs may run at once. This is the ONE number that governs both
  # the fan-out and the Semantic Scholar rate budget - the key allows 1 req/s
  # cumulative across every job, so each job paces itself to 1/CITATION_CONCURRENCY
  # of that. Raising it does not make the run faster (the ceiling is global); it only
  # shortens each individual job. Keep it under the 20 concurrent jobs public repos
  # get, leaving room for the models and datasets jobs.
  CITATION_CONCURRENCY: '15'

jobs:
  update-models-data:
    name: "Update Daily Models Data"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Test Models pipeline on a small data subset
      env:
        TEST_DATA_LIMIT: 5000
      run: python test_pipeline.py

    - name: Run Models processing pipeline (full dataset)
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: timeout 3600s python -u main.py

    - name: Verify Models output file
      id: verify_models
      run: |
        if [ ! -f "models_processed.parquet" ]; then exit 1; fi
        file_size_mb=$(($(stat -c%s "models_processed.parquet") / 1024 / 1024))
        if [ $file_size_mb -lt 2 ]; then exit 1; fi
        echo "file_path=models_processed.parquet" >> $GITHUB_OUTPUT
        echo "has_changes=true" >> $GITHUB_OUTPUT

    - name: Upload Models data to Hugging Face
      if: steps.verify_models.outputs.has_changes == 'true'
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        pip install huggingface_hub
        hf upload evijit/modelverse_daily_data \
          ${{ steps.verify_models.outputs.file_path }} \
          ${{ steps.verify_models.outputs.file_path }} \
          --repo-type dataset --commit-message "Automated models data update"

  update-datasets-data:
    name: "Update Daily Datasets Data"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Test Datasets pipeline on a small data subset
      env:
        TEST_DATA_LIMIT: 5000
      run: python test_pipeline_datasets.py

    - name: Run Datasets processing pipeline (full dataset)
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: timeout 2400s python -u main_datasets.py

    - name: Verify Datasets output file
      id: verify_datasets
      run: |
        if [ ! -f "datasets_processed.parquet" ]; then exit 1; fi
        file_size_mb=$(($(stat -c%s "datasets_processed.parquet") / 1024 / 1024))
        if [ $file_size_mb -lt 1 ]; then exit 1; fi
        echo "file_path=datasets_processed.parquet" >> $GITHUB_OUTPUT
        echo "has_changes=true" >> $GITHUB_OUTPUT

    - name: Upload Datasets data to Hugging Face
      if: steps.verify_datasets.outputs.has_changes == 'true'
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        pip install huggingface_hub
        hf upload evijit/dataverse_daily_data \
          ${{ steps.verify_datasets.outputs.file_path }} \
          ${{ steps.verify_datasets.outputs.file_path }} \
          --repo-type dataset --commit-message "Automated datasets data update"

  # --- Papers ---
  #
  # Citation fetching fans out over a matrix built from the live paper count, so it
  # scales with the Hub on its own - there are no hand-declared waves to outgrow.
  # `max-parallel` is what batches the work, and the scheduler starts the next batch
  # the moment a slot frees up.
  #
  # The papers parquet is downloaded from HuggingFace exactly ONCE here and shared
  # with every batch as an artifact. Back when all 60+ batches fetched it themselves,
  # HuggingFace rate-limited the run with HTTP 429 and jobs died after burning
  # through their retry ladders.
  papers-setup:
    name: "Papers - Fetch Snapshot & Plan Batches"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      total_papers: ${{ steps.plan.outputs.total_papers }}
      matrix: ${{ steps.plan.outputs.matrix }}
      # Re-exported so the fetch job can use it for BOTH max-parallel and the
      # per-job rate budget. The strategy block cannot read the `env` context, only
      # `needs`, so routing it through an output is what keeps the two in sync.
      concurrency: ${{ steps.plan.outputs.concurrency }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Fetch papers snapshot and plan batches
      id: plan
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        set -euo pipefail

        # Fetches once, writes papers_raw.parquet + papers_count.txt (and best-effort
        # previous_citations.parquet for the batch cache). Output stays visible in the
        # log rather than being swallowed by a pipe.
        python -u fetch_papers_snapshot.py

        PAPER_COUNT=$(tr -d '[:space:]' < papers_count.txt)
        if ! [[ "$PAPER_COUNT" =~ ^[0-9]+$ ]] || [ "$PAPER_COUNT" -lt 1 ]; then
          echo "::error::Invalid paper count from snapshot: '$PAPER_COUNT'"
          exit 1
        fi

        # Batch size adapts to the paper count. Diagnostics go to stderr so only the
        # JSON matrix is captured here.
        MATRIX=$(python generate_matrix.py "$PAPER_COUNT")
        BATCHES=$(printf '%s' "$MATRIX" | python -c 'import json,sys; print(len(json.load(sys.stdin)))')

        echo "Total papers: $PAPER_COUNT"
        echo "Batches: $BATCHES (max $CITATION_CONCURRENCY at a time)"
        echo "total_papers=$PAPER_COUNT" >> $GITHUB_OUTPUT
        echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
        echo "concurrency=$CITATION_CONCURRENCY" >> $GITHUB_OUTPUT

    - name: Upload papers snapshot for citation jobs
      uses: actions/upload-artifact@v7
      with:
        name: papers-raw-snapshot
        path: |
          papers_raw.parquet
          papers_raw_meta.json
          previous_citations.parquet
        if-no-files-found: error
        retention-days: 1

  papers-fetch-citations:
    name: "Papers - Citations Batch ${{ matrix.job_id }}"
    needs: papers-setup
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      matrix:
        include: ${{ fromJson(needs.papers-setup.outputs.matrix) }}
      # A failed batch must not cancel the others: those papers just keep the
      # previous day's citations when results are merged.
      fail-fast: false
      max-parallel: ${{ fromJson(needs.papers-setup.outputs.concurrency) }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Download papers snapshot
      uses: actions/download-artifact@v8
      with:
        name: papers-raw-snapshot

    - name: Fetch citations for batch
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HF_STARTUP_JITTER: '1'
        SEMANTIC_SCHOLAR_KEY: ${{ secrets.SEMANTIC_SCHOLAR_KEY }}
        # Same value as max-parallel above, from the same output. The 1 req/s
        # Semantic Scholar ceiling is cumulative, so each job needs to know how many
        # ways it is being split.
        CITATION_JOB_CONCURRENCY: ${{ needs.papers-setup.outputs.concurrency }}
      run: |
        python -u fetch_citations_batch.py ${{ matrix.start_idx }} ${{ matrix.end_idx }}

    - name: Upload batch artifact
      uses: actions/upload-artifact@v7
      with:
        name: citations-batch-${{ matrix.job_id }}
        path: citations_batch_*.parquet
        if-no-files-found: error
        retention-days: 7

  papers-merge-and-process:
    name: "Papers - Merge Citations & Process"
    needs: [papers-setup, papers-fetch-citations]
    # Runs even when some batches failed - partial citation coverage is expected and
    # handled by preserving the previous day's values. Only a total absence of
    # results is fatal, and the merge step reports that itself.
    if: |
      always() &&
      needs.papers-setup.result == 'success' &&
      needs.papers-fetch-citations.result != 'skipped' &&
      needs.papers-fetch-citations.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Download spaCy model
      run: |
        python -m spacy download en_core_web_lg

    - name: Download papers snapshot
      uses: actions/download-artifact@v8
      with:
        name: papers-raw-snapshot

    - name: Download all citation batch artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: citations-batch-*
        merge-multiple: true

    - name: Merge all citation batches
      run: |
        python merge_citation_batches.py

    - name: Test Papers pipeline on a small data subset
      env:
        TEST_DATA_LIMIT: 50
        ENABLE_CITATION_FETCHING: false
      run: python test_pipeline_papers.py

    - name: Run Papers processing pipeline (taxonomy only)
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        ENABLE_CITATION_FETCHING: false
      run: |
        timeout 3600s python -u main_papers.py
        python merge_citations_into_papers.py

    - name: Verify Papers output files
      id: verify_papers
      run: |
        if [ ! -f "papers_with_semantic_taxonomy.parquet" ]; then exit 1; fi
        file_size_mb=$(($(stat -c%s "papers_with_semantic_taxonomy.parquet") / 1024 / 1024))
        if [ $file_size_mb -lt 1 ]; then exit 1; fi
        echo "parquet_file=papers_with_semantic_taxonomy.parquet" >> $GITHUB_OUTPUT
        echo "has_changes=true" >> $GITHUB_OUTPUT

    - name: Upload Papers data to Hugging Face
      if: steps.verify_papers.outputs.has_changes == 'true'
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        pip install huggingface_hub
        hf upload evijit/paperverse_daily_data \
          papers_with_semantic_taxonomy.parquet \
          papers_with_semantic_taxonomy.parquet \
          --repo-type dataset --commit-message "Automated papers update with citations"

        hf upload evijit/paperverse_daily_data \
          taxonomy_report.txt \
          taxonomy_report.txt \
          --repo-type dataset --commit-message "Automated papers update with citations"

        hf upload evijit/paperverse_daily_data \
          taxonomy_distribution.json \
          taxonomy_distribution.json \
          --repo-type dataset --commit-message "Automated papers update with citations"
